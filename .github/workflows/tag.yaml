---
name: tag

# ---------------
# Control secrets
# ---------------
#
# At the GitHub 'organisation' or 'project' level you are expected to
# have the following GitHub 'Repository Secrets' defined
# (i.e. via 'Settings -> Secrets'): -
#
# DOCKERHUB_USERNAME
# DOCKERHUB_TOKEN
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# (none)

on:
  push:
    tags:
      - "*"

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set lower case owner name
        run: echo "owner=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: "${{ github.repository_owner }}"
      - name: Set version
        run: echo "version=${VERSION}" >> "$GITHUB_ENV"
        env:
          VERSION: "${{ github.ref_name }}"
      # Build the image locally first so it can be scanned before it is pushed.
      # The push (below) re-uses the build cache, so the image is not built twice.
      - name: Build (Tag)
        uses: docker/build-push-action@v6
        with:
          tags: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:${{ github.ref_name }}
          load: true
          build-args: |
            VERSION=${{ env.version }}
      # Refuse to release an image with CRITICAL or HIGH vulnerabilities
      # that have a fix available. Results are not uploaded to the Security tab
      # (code scanning does not accept tag refs) - the 'latest' workflow does that.
      - name: Scan image
        # Pinned to a commit (v0.36.0), not a tag, as tags can be moved
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:${{ github.ref_name }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Push (Tag)
        uses: docker/build-push-action@v6
        with:
          tags: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:${{ github.ref_name }}
          push: true
          build-args: |
            VERSION=${{ env.version }}
