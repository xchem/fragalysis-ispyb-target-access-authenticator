---
name: latest

# Actions that take place after every commit.

# ---------------
# Control secrets
# ---------------
#
# At the GitHub 'organisation' or 'project' level you are expected to
# have the following GitHub 'Repository Secrets' defined
# (i.e. via 'Settings -> Secrets'): -
#
# DOCKERHUB_USERNAME
# DOCKERHUB_TOKEN
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# (none)

on:
  push:
    branches:
    - '*'
    tags-ignore:
    - '*'
  schedule:
  # Build every Sunday (0) at 4:30pm
  - cron: '30 16 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@v5
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set lower case owner name
      run: echo "owner=${OWNER,,}" >> "$GITHUB_ENV"
      env:
        OWNER: '${{ github.repository_owner }}'
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        tags: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:latest
        push: true
