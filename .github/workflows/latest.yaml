---
name: latest

# Actions that take place after every commit.

# ---------------
# Control secrets
# ---------------
#
# At the GitHub 'organisation' or 'project' level you are expected to
# have the following GitHub 'Repository Secrets' defined
# (i.e. via 'Settings -> Secrets'): -
#
# DOCKERHUB_USERNAME
# DOCKERHUB_TOKEN
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# (none)

on:
  push:
    branches:
    # '**' (not '*') so that branch names containing '/' are also built
    - '**'
    tags-ignore:
    - '*'
  schedule:
  # Build every Sunday (0) at 4:30pm
  - cron: '30 16 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To upload the image scan results to the repository's Security tab
      security-events: write
    steps:
    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@v5
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Set lower case owner name
      run: echo "owner=${OWNER,,}" >> "$GITHUB_ENV"
      env:
        OWNER: '${{ github.repository_owner }}'
    - name: Set image tag
      # The default branch publishes ':latest',
      # every other branch publishes an image tagged with its own name.
      # We use the slug of the branch (from the slug action above) because
      # image tags cannot contain '/', i.e. 'ci/my-branch' is 'ci-my-branch'.
      run: |
        if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
          echo "image_tag=latest" >> "$GITHUB_ENV"
        else
          echo "image_tag=${GITHUB_REF_SLUG}" >> "$GITHUB_ENV"
        fi
      env:
        REF_NAME: '${{ github.ref_name }}'
        DEFAULT_BRANCH: "${{ github.event.repository.default_branch || 'main' }}"
    # Build the image locally first so it can be scanned before it is pushed.
    # The push (below) re-uses the build cache, so the image is not built twice.
    - name: Build
      uses: docker/build-push-action@v6
      with:
        tags: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:${{ env.image_tag }}
        load: true
    # Report every vulnerability in the image to the Security tab...
    - name: Scan image (report)
      # Pinned to a commit (v0.36.0), not a tag, as tags can be moved
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:${{ env.image_tag }}
        scanners: vuln
        format: sarif
        output: trivy-results.sarif
    - name: Upload scan results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image
    # ...but only refuse to push the image for CRITICAL or HIGH
    # vulnerabilities that have a fix available.
    - name: Scan image (gate)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:${{ env.image_tag }}
        scanners: vuln
        format: table
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 1
    - name: Push
      uses: docker/build-push-action@v6
      with:
        tags: ${{ env.owner }}/fragalysis-ispyb-target-access-authenticator:${{ env.image_tag }}
        push: true
